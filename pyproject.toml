[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lossless"
version = "0.1.0"
description = "Distributional conformance tests for LLM samplers and speculative decoding (randomized PIT, exact two-sample tests)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
license = {text = "Apache-2.0"}
authors = [{name = "Auden Venn"}]

[project.optional-dependencies]
identity = ["transformers>=4.40"]
test = ["pytest>=7"]

[project.scripts]
lossless = "lossless.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
